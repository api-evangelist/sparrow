generated: '2026-08-28'
method: probed
source: >-
  Direct anonymous HTTPS probes of /.well-known/ paths on every Sparrow host discovered from
  apis.yml, the sparrow.com sitemap, and the Content-Security-Policy header served by
  app.trysparrow.com (which names api.trysparrow.com, login.trysparrow.com, support.trysparrow.com
  and uploads.trysparrow.com as the application's own origins).
note: >-
  One real document set was found, and it is on Sparrow's own domain: login.trysparrow.com serves an
  OpenID Connect discovery document, an RFC 8414 authorization-server metadata document and a JWKS.
  That host is Sparrow's Auth0 custom domain (issuer https://login.trysparrow.com/) and is named as
  the app's auth origin in the app.trysparrow.com CSP. Every /.well-known/ path on app.sparrow.com,
  app.trysparrow.com and support.trysparrow.com answers HTTP 200 with the same SPA/HTML shell
  regardless of path — those are catch-all false positives, not documents, and are recorded as
  misses. status.trysparrow.com does serve a security.txt, but it redirects to
  sparrowstatus.com/.well-known/security.txt and its contents are Atlassian's
  (Canonical https://www.atlassian.com/.well-known/security.txt, contact security@atlassian.com) —
  it belongs to the Statuspage platform, not to Sparrow, so no SecurityTxt pointer is emitted.
  Sparrow's own vulnerability reporting address is published at https://sparrow.com/responsible-disclosure/
  instead of in a security.txt.
