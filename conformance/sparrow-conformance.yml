method: probed
source: >-
  https://login.trysparrow.com/.well-known/openid-configuration (probed), https://sparrow.com/security/
  and https://trust.trysparrow.com/ (searched). Sparrow publishes no API contract, so every
  API-shaped standard below is asserted false on the basis of an exhaustive negative probe rather
  than a contract reading.
standards:
- id: oauth2
  conforms: true
  evidence: >-
    login.trysparrow.com serves RFC 8414 authorization-server metadata at
    /.well-known/oauth-authorization-server (HTTP 200) advertising authorization_code,
    client_credentials, refresh_token, device_code, token-exchange and jwt-bearer grants. This is the
    sign-in surface of Sparrow's own application, not a partner API.
- id: oidc
  conforms: true
  evidence: >-
    /.well-known/openid-configuration on login.trysparrow.com returns a complete OpenID Connect
    discovery document (issuer https://login.trysparrow.com/, JWKS, userinfo, backchannel logout,
    14 scopes_supported).
- id: pkce
  conforms: true
  evidence: 'code_challenge_methods_supported: [S256, plain] in the discovery document.'
- id: dpop
  conforms: true
  evidence: 'dpop_signing_alg_values_supported: [ES256] in the discovery document.'
- id: rfc8414
  conforms: true
  evidence: OAuth 2.0 Authorization Server Metadata served at the RFC 8414 path, HTTP 200.
- id: rfc9728
  conforms: false
  evidence: /.well-known/oauth-protected-resource returns 404 on api.trysparrow.com and every other host.
- id: rfc9457
  conforms: false
  evidence: No published error contract or problem+json envelope; no OpenAPI exists to read.
- id: saml
  conforms: true
  evidence: >-
    trysparrow-samlidp.us.auth0.com appears as a permitted frame-src in the app.trysparrow.com
    Content-Security-Policy, and enterprise SSO is described on https://sparrow.com/security/.
- id: idempotency
  conforms: false
  evidence: No public write surface and no published idempotency semantics.
- id: pagination
  conforms: false
  evidence: No published API reference of any kind.
- id: scim
  conforms: false
  evidence: >-
    No SCIM schema URN, /scim/v2 endpoint or provisioning documentation found. Sparrow's own FAQ
    states HRIS and payroll integration is delivered "via file feed".
- id: odata
  conforms: false
  evidence: No $metadata surface on any Sparrow host.
- id: fhir
  conforms: false
  evidence: Not a healthcare data provider; no FHIR surface. Sparrow coordinates with medical providers by paperwork, not by API.
