  state: none
  reason: no-developer-program
  detail: >-
    Sparrow ships leave management only as an end-user web application: its own FAQ answers the
    integration question with "Sparrow can integrate with your HRIS via file feed", there is no
    developer portal, and the backend its SPA calls (api.trysparrow.com, named in the
    app.trysparrow.com Content-Security-Policy) returns a bare 404 to every anonymous path including
    /openapi.json and every /.well-known/ location.
