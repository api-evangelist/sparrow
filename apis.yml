aid: sparrow
name: Sparrow
description: >-
  Sparrow is an end-to-end employee leave management platform for employers in the United States
  and Canada, pairing software with a team of leave specialists to administer FMLA, CFRA, parental,
  medical and state paid-leave programs. The platform automates employee intake, files the
  associated insurance claims, coordinates with medical providers, delivers required notices, builds
  a personalized leave and financial plan for each employee, and reconciles leave pay back into
  payroll. Sparrow connects to customer HRIS and payroll systems — Workday, BambooHR, Gusto and ADP
  among them — by file feed rather than through a public developer API, and it publishes no
  developer portal, OpenAPI or SDK. The company was founded in 2018 in San Francisco by Deborah
  Hanus and Samarth Keshava, has raised roughly $64M across Series A and Series B rounds, and its
  shares are quoted on secondary marketplaces such as Forge Global.
